name: 시장 브리핑

on:
  schedule:
    # UTC 기준. 01:00 UTC = 한국 시간 10:00
    - cron: "0 1 * * *"
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write        # reports/ 를 저장소에 되커밋하려면 필요

concurrency:
  group: briefing        # 겹쳐 돌면서 push 가 충돌하는 것을 막는다
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # LLM: 집에 있는 llama.cpp 를 Cloudflare Tunnel 로 노출한 것
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LOCAL_MODEL: ${{ vars.LOCAL_MODEL }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: "true"
      LANGSMITH_PROJECT: news-market-agent

    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: LLM 서버 확인
        # 집 PC 가 꺼져 있으면 여기서 멈춘다. 30분 뒤 타임아웃보다 낫다.
        run: |
          curl -sf -m 30 -o /dev/null \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            "$OPENAI_BASE_URL/models" \
            || { echo "::error::LLM 서버에 닿지 않습니다 ($OPENAI_BASE_URL)"; exit 1; }

      - name: 브리핑 실행
        run: uv run python main.py

      - name: 브리핑 커밋
        # 러너는 매번 새 머신이라 reports/ 가 사라진다.
        # 다음 실행의 planner 가 어제 브리핑을 읽으려면 저장소에 남아야 한다.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet && exit 0
          git commit -m "브리핑 $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
